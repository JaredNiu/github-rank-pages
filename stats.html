<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GitHub 开源项目榜单的访问统计：每日页面访问量与各榜期（日榜 / 周榜 / 月榜）被查看次数。" />
  <meta name="theme-color" id="themeColorMeta" content="#ffffff" />
  <title>访问统计 · GitHub 开源项目榜单</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14'%3E%E2%AD%90%3C/text%3E%3C/svg%3E" />
  <!-- 主题必须在样式表之前定好，否则深色模式刷新时会先闪一下白底 -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('github-rank-theme');
        var preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = (saved === 'dark' || saved === 'light') ? saved : (preferDark ? 'dark' : 'light');
      } catch (e) { /* 隐私模式忽略 */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="head-row">
        <div class="brand">
          <h1 class="brand-title">访问统计</h1>
          <p class="brand-sub">GitHub 开源项目榜单 · 每日页面访问量与各榜期查看量</p>
        </div>
        <div class="head-actions">
          <a class="repo-link" href="https://github.com/JaredNiu/github-rank-pages"
             target="_blank" rel="noopener noreferrer" aria-label="查看源码">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换深浅色">
            <svg class="ico-moon" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6.5 6.5 0 1 0 7.7 7.7Z"/></svg>
            <svg class="ico-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.1v1.7M8 13.2v1.7M1.1 8h1.7M13.2 8h1.7M3.1 3.1l1.2 1.2M11.7 11.7l1.2 1.2M12.9 3.1l-1.2 1.2M4.3 11.7l-1.2 1.2"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="stats-wrap">
        <h2 class="stats-h">实时汇总</h2>
        <div class="stats-cards" id="statsCards"></div>
        <p class="stats-note" id="statsNote"></p>

        <h2 class="stats-h">每日明细</h2>
        <div class="stats-table-wrap">
          <table class="stats-table" id="statsTable">
            <thead>
              <tr>
                <th>日期（北京时间）</th>
                <th class="num">页面访问</th>
                <th class="num">日榜查看</th>
                <th class="num">周榜查看</th>
                <th class="num">月榜查看</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="stats-note" id="archiveNote"></p>
      </section>

      <footer class="site-footer">
        <p class="footer-extra"><a href="index.html" class="stats-back">← 返回榜单</a></p>
      </footer>
    </main>
  </div>

  <!-- 本页只读取统计（GET），绝不调用计数（POST /hit/），因此打开本页不计入访问量。 -->
  <script src="assets/stats.js"></script>
</body>
</html>
